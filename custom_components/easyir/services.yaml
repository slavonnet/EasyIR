send_raw:
  name: Send raw IR via hub
  description: Encode raw mark/space timings and send through an EasyIR hub transport.
  fields:
    hub_id:
      required: false
      description: EasyIR hub config entry id (preferred).
      selector:
        text:
    ieee:
      required: false
      description: Zigbee IEEE of the IR hub.
      example: "8c:65:a3:ff:fe:92:63:ce"
      selector:
        text:
    endpoint_id:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 240
          mode: box
    raw_timings:
      required: true
      example: [3198, -9806, 487, -1553]
      selector:
        object:

send_profile_command:
  name: Send command from profile json
  description: Resolve profile command and send IR through a hub.
  fields:
    hub_id:
      required: false
      selector:
        text:
    ieee:
      required: false
      selector:
        text:
    profile_path:
      required: true
      example: "/config/ir/7062.json"
      selector:
        text:
    action:
      required: true
      description: "off | cool | dry"
      selector:
        select:
          options:
            - "off"
            - "cool"
            - "dry"
    hvac_mode:
      required: false
      example: "cool"
      selector:
        text:
    fan_mode:
      required: false
      example: "auto"
      selector:
        text:
    temperature:
      required: false
      example: 24
      selector:
        number:
          min: 16
          max: 35
          mode: box
    endpoint_id:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 240
          mode: box

start_learn:
  name: Start IR learn mode on hub
  description: Enable IR learn mode without polling. Use read_learned_ir to fetch code on demand.
  fields:
    hub_id:
      required: false
      selector:
        text:
    ieee:
      required: false
      selector:
        text:
    endpoint_id:
      required: false
      selector:
        number:
          min: 1
          max: 240
          mode: box
    timeout_s:
      required: false
      default: 25
      selector:
        number:
          min: 5
          max: 120
          mode: box

read_learned_ir:
  name: Read learned IR code (on demand)
  description: Single attribute read from hub after learn mode was started.
  fields:
    hub_id:
      required: false
      selector:
        text:
    ieee:
      required: false
      selector:
        text:
    endpoint_id:
      required: false
      selector:
        number:
          min: 1
          max: 240
          mode: box

stop_learn:
  name: Stop IR learn mode
  description: Request learn mode stop (device may auto-exit on TS1201).
  fields:
    hub_id:
      required: false
      selector:
        text:
    ieee:
      required: false
      selector:
        text:

capture_inbound_ir:
  name: Capture inbound IR (on demand)
  description: Listen for ZHA inbound IR events for a limited duration (no always-on loop).
  fields:
    duration_s:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 300
          mode: box

learn_once:
  name: Start learn mode (legacy alias)
  description: Alias for start_learn without attribute polling loop.
  fields:
    hub_id:
      required: false
      selector:
        text:
    ieee:
      required: false
      selector:
        text:
    endpoint_id:
      required: false
      selector:
        number:
          min: 1
          max: 240
          mode: box
    timeout_s:
      required: false
      default: 25
      selector:
        number:
          min: 5
          max: 120
          mode: box

learn_code:
  name: Start learn mode (legacy alias)
  description: Backward-compatible alias for learn_once.
  fields:
    hub_id:
      required: false
      selector:
        text:
    ieee:
      required: false
      selector:
        text:
    endpoint_id:
      required: false
      selector:
        number:
          min: 1
          max: 240
          mode: box
    timeout_seconds:
      required: false
      default: 25
      selector:
        number:
          min: 5
          max: 120
          mode: box
    timeout_s:
      required: false
      default: 25
      selector:
        number:
          min: 5
          max: 120
          mode: box
